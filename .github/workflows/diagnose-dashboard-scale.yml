name: Diagnose dashboard forecast fixture
on:
  push:
    branches: [fix/dashboard-chart-ceiling-20261012]
    paths: [.github/workflows/diagnose-dashboard-scale.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: [fef0cfed9208300fbfc8983b2e342a49601f5a3f, 5ec6b3369d9323722ed1e71db6049e671a3586e7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture source for isolated diagnosis
        run: git archive HEAD -o /tmp/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-source-${{ matrix.revision }}
          path: /tmp/source.tar
          retention-days: 1
      - name: Diagnose the unchanged forecast assertion using synthetic data only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/startup-browser.cjs')
          s = p.read_text()
          anchor = "      await page.waitForFunction(()=>document.querySelector('#p-summary .rt-chart-forecast-shell'));"
          assert s.count(anchor) == 1
          diagnostic = '''      await page.waitForTimeout(500);
                console.log('FORECAST_DIAGNOSTIC',JSON.stringify(await page.evaluate(()=>{
                  const today=new Date().toISOString().slice(0,10);
                  const from=new Date();from.setUTCDate(from.getUTCDate()-14);
                  const to=new Date();to.setUTCDate(to.getUTCDate()-1);
                  const events=getSaleEventsInRange(from.toISOString().slice(0,10),to.toISOString().slice(0,10));
                  return {today,period:SUMMARY_PERIOD,events:events.map(e=>({id:e.id,date:e.saleDate,price:e.salePrice,return:e.isReturnAdjustment})),snapshots:Array.from(document.querySelectorAll('#p-summary svg')).filter(s=>s.__rtPolishedSnapshot).map(s=>({id:s.id,visible:!!s.getClientRects().length,shells:s.querySelectorAll('.rt-chart-forecast-shell').length,labels:s.__rtPolishedSnapshot.labels,rev:s.__rtPolishedSnapshot.revData,profit:s.__rtPolishedSnapshot.profitData,opts:s.__rtPolishedSnapshot.opts})),setSummaryPeriod:setSummaryPeriod.toString()};
                })), 'ERRORS', JSON.stringify(errors));
          '''
          p.write_text(s.replace(anchor,diagnostic+anchor))
          PY
          node tests/startup-browser.cjs
