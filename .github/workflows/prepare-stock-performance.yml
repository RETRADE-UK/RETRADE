name: Prepare reviewed stock fixes
on:
  push:
    branches: [fix/stock-performance-release-20261014]
    paths: [.github/workflows/prepare-stock-performance.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: stock-performance-release-live
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'RETRADE-UK/RETRADE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stock-performance-release-20261014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Retrieve the tested live candidate
        uses: actions/download-artifact@v4
        with:
          repository: RETRADE-UK/RETRADE
          run-id: 38483427254
          name: stock-performance-candidate-live
          path: ${{ runner.temp }}/reviewed-stock-fix
          github-token: ${{ github.token }}
      - name: Validate and apply the reviewed plain-text patch
        env:
          PATCH_DIR: ${{ runner.temp }}/reviewed-stock-fix
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = '3c1a2f4940c77fabe18331bc8a22674c1f9e42fa'
          test "$(git hash-object src/core/application.js)" = '1ceec1a0843a96eee2c6d5c7e6af843517edc58b'
          echo "8d6925b58e7d0b6a1f7ec2e2f051722376f729789f721415024e25401f6f75d7  $PATCH_DIR/stock-performance-live.patch" | sha256sum --check
          git apply --check --whitespace=error "$PATCH_DIR/stock-performance-live.patch"
          git apply --index --whitespace=error "$PATCH_DIR/stock-performance-live.patch"
          python3 - <<'PY'
          import subprocess
          expected = {'assets/styles/workspaces.css','config/assets.js','docs/RUNTIME_MAP.md','index.html','package.json','src/core/application.js','src/features/charts/polish.js','tests/dashboard-chart-browser.cjs','tests/dashboard-chart-scale.cjs','tests/stock-performance-browser.cjs','tests/stock-performance.cjs'}
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual == expected, 'Unexpected patch scope'
          PY
          git diff --cached --check
          git diff --cached --stat
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit tested source to the release branch only
        run: |
          set -euo pipefail
          git fetch origin main fix/stock-performance-release-20261014
          test "$(git rev-parse origin/main)" = '3c1a2f4940c77fabe18331bc8a22674c1f9e42fa'
          test "$(git rev-parse origin/fix/stock-performance-release-20261014)" = "$GITHUB_SHA"
          git diff --exit-code
          git rm .github/workflows/prepare-stock-performance.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: regular chart ticks, reconciled months and stable stock actions'
          git push origin HEAD:refs/heads/fix/stock-performance-release-20261014
