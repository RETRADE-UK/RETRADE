name: Prepare scoped Stock and Performance patch
on:
  push:
    branches: [fix/stock-performance-polish-20261013]
    paths: [scripts/stock-performance-patch-2.b64, .github/workflows/prepare-stock-performance.yml]
permissions:
  contents: write
concurrency:
  group: prepare-stock-performance
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stock-performance-polish-20261013
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply the exact reviewed patch to its isolated branch
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','hash-object','src/core/application.js'],text=True).strip()=='1ceec1a0843a96eee2c6d5c7e6af843517edc58b', 'Core changed: review before applying'
          encoded=''.join(Path('scripts/stock-performance-patch-'+str(n)+'.b64').read_text().strip() for n in [1,2])
          raw=lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='6f3a5c0d3bce203cd13fe1a4ee31590bfe57b3956b4726f02438f171b5b7c155'
          patch=json.loads(raw)
          subprocess.run(['git','apply','--index','--whitespace=error','-'],input=(patch['common']+patch['live']).encode(),check=True)
          p=Path('tests/stock-performance-browser.cjs');s=p.read_text()
          s=s.replace("await row('a').scrollIntoViewIfNeeded();", "await row('a').evaluate(e=>e.scrollIntoView({block:'center',behavior:'instant'}));await page.waitForTimeout(80);")
          s=s.replace("await row('a').locator('input').check();", "const hit=await row('a').locator('input').boundingBox();\n   assert(await row('a').locator('input').evaluate(e=>{const r=e.getBoundingClientRect();return document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)===e;}),'Checkbox is reachable before the audit');\n   if(width<600)await page.touchscreen.tap(hit.x+hit.width/2,hit.y+hit.height/2);else await page.mouse.click(hit.x+hit.width/2,hit.y+hit.height/2);\n   assert(await row('a').locator('input').isChecked());")
          s=s.replace("'First selection does not push the list or scroll'", "'First selection does not push the list or scroll: '+JSON.stringify({width,before,after})")
          p.write_text(s)
          p=Path('package.json');d=json.loads(p.read_text())
          d['scripts']['test']='node tests/stock-performance-browser.cjs && '+d['scripts']['test']
          d['scripts']['check']='node tests/stock-performance.cjs && '+d['scripts']['check']
          p.write_text(json.dumps(d,indent=2)+'\n')
          p=Path('docs/RUNTIME_MAP.md');p.write_text(p.read_text()+'\n\n## Stock selection and Performance reconciliation — 13 October 2026'+patch['notes'])
          for n in [1,2]:Path('scripts/stock-performance-patch-'+str(n)+'.b64').unlink()
          Path('.github/workflows/prepare-stock-performance.yml').unlink()
          PY
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node tests/dashboard-chart-browser.cjs && node tests/stock-performance-browser.cjs
      - run: npm run build
      - name: Publish only the scoped patch and remove preparation files
        run: |
          git add -u
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: regular chart ticks, reconciled months and stable stock actions'
          git push origin HEAD:refs/heads/fix/stock-performance-polish-20261013
