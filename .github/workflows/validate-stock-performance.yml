name: Validate Stock and Performance candidates (read only)
on:
  push:
    branches: [fix/stock-performance-polish-20261013]
    paths: [.github/workflows/validate-stock-performance.yml, tests/stock-performance-browser.cjs]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: live
            repository: RETRADE-UK/RETRADE
            base: 3c1a2f4940c77fabe18331bc8a22674c1f9e42fa
            core: 1ceec1a0843a96eee2c6d5c7e6af843517edc58b
          - environment: staging
            repository: RETRADE-UK/RETRADE-STAGING
            base: 404b9bf3c855fc3267c40df41e071d868b481f18
            core: cb285a169b3526d623ba54daf556d4b053916b9f
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.base }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: RETRADE-UK/RETRADE
          ref: da5fe0194930f705c4db3f95b71bfcacd330fd6a
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: tests/stock-performance-browser.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Prepare candidate only in the disposable test checkout
        working-directory: source
        env:
          CANDIDATE_ENVIRONMENT: ${{ matrix.environment }}
          BASE_CORE_SHA: ${{ matrix.core }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','hash-object','src/core/application.js'],text=True).strip()==os.environ['BASE_CORE_SHA']
          encoded=''.join((Path('../candidate/scripts')/('stock-performance-patch-'+str(n)+'.b64')).read_text().strip() for n in [1,2])
          raw=lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='6f3a5c0d3bce203cd13fe1a4ee31590bfe57b3956b4726f02438f171b5b7c155'
          patch=json.loads(raw)
          subprocess.run(['git','apply','--index','--whitespace=error','-'],input=(patch['common']+patch[os.environ['CANDIDATE_ENVIRONMENT']]).encode(),check=True)
          Path('tests/stock-performance-browser.cjs').write_bytes(Path('../review/tests/stock-performance-browser.cjs').read_bytes())
          p=Path('package.json');d=json.loads(p.read_text())
          d['scripts']['test']='node tests/stock-performance-browser.cjs && '+d['scripts']['test']
          d['scripts']['check']='node tests/stock-performance.cjs && '+d['scripts']['check']
          p.write_text(json.dumps(d,indent=2)+'\n')
          p=Path('docs/RUNTIME_MAP.md');p.write_text(p.read_text()+'\n\n## Stock selection and Performance reconciliation — 13 October 2026'+patch['notes'])
          # A plain-text review artifact only: no commit, push or deployment.
          out=Path(os.environ['RUNNER_TEMP_DIR'])/('stock-performance-'+os.environ['CANDIDATE_ENVIRONMENT']+'.patch')
          out.write_bytes(subprocess.check_output(['git','diff','HEAD','--binary']))
          PY
      - run: npm ci
        working-directory: source
      - run: npx playwright install --with-deps chromium
        working-directory: source
      - name: Check candidate invariants
        working-directory: source
        run: |
          set -o pipefail
          npm run check 2>&1 | tee '${{ runner.temp }}/stock-performance-${{ matrix.environment }}-check.log'
      - name: Run complete isolated test suite
        working-directory: source
        run: |
          set -o pipefail
          npm test 2>&1 | tee '${{ runner.temp }}/stock-performance-${{ matrix.environment }}-test.log'
      - name: Build candidate
        working-directory: source
        run: |
          set -o pipefail
          npm run build 2>&1 | tee '${{ runner.temp }}/stock-performance-${{ matrix.environment }}-build.log'
      - name: Save review patch and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-performance-candidate-${{ matrix.environment }}
          path: ${{ runner.temp }}/stock-performance-${{ matrix.environment }}*
          retention-days: 7
          if-no-files-found: error
